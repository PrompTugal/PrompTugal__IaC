name: DNS apply
# Create the records in org/dns.json that the promptugal.news zone lacks. CREATE only: never changes or deletes a
# record, never writes the apex. Assumes the AWS role through GitHub OIDC from the apply environment; no AWS key is
# stored anywhere. Until Dinis has set PT_AWS_ROLE_ARN and PT_ZONE_ID_NEWS there, the run says so and changes nothing.
on:
  push:
    branches: [dev]
    paths: ['org/dns.json']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: dns-apply
defaults:
  run:
    shell: bash
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run.mjs && node build/abp.mjs validate
      - name: Is the AWS role set up?
        id: ready
        env:
          ROLE: ${{ vars.PT_AWS_ROLE_ARN }}
          ZONE: ${{ vars.PT_ZONE_ID_NEWS }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$ZONE" ]; then echo "PT_AWS_ROLE_ARN or PT_ZONE_ID_NEWS is not set in the apply environment: nothing applied." | tee -a "$GITHUB_STEP_SUMMARY"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - id: app
        if: steps.ready.outputs.ok == 'true'
        uses: actions/create-github-app-token@v1.12.0
        with:
          app-id: ${{ vars.PT_IAC_APP_ID }}
          private-key: ${{ secrets.PT_IAC_APP_PRIVATE_KEY }}
          owner: PrompTugal
          # Read only: which custom domains the repositories claim.
          permission-metadata: read
          permission-pages: read
      - name: The domains PrompTugal repositories claim
        if: steps.ready.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node build/dns-claims.mjs claims.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The OIDC subject GitHub sends (printed so the role's trust policy can keep only this form)
        if: steps.ready.outputs.ok == 'true'
        # Prints only the sub claim. The token itself is never printed or saved.
        run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s).value||"";const p=JSON.parse(Buffer.from(t.split(".")[1]||"","base64url").toString()||"{}");console.log("OIDC sub:",p.sub||"(none)")})' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.ready.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PT_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
      - name: Plan against the zone
        if: steps.ready.outputs.ok == 'true'
        env:
          ZONE: ${{ vars.PT_ZONE_ID_NEWS }}
        run: |
          aws route53 list-resource-record-sets --hosted-zone-id "$ZONE" --output json > live.json
          node build/dns-plan.mjs live.json plan.json claims.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Records pointing at GitHub Pages that no repository claims (report)
        if: steps.ready.outputs.ok == 'true'
        run: node build/dns-unclaimed.mjs live.json claims.json | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::a name points at GitHub Pages with no PrompTugal repository claiming it (see the summary)"
      - name: Policy check
        if: steps.ready.outputs.ok == 'true'
        run: node build/abp.mjs actions plan.json
      - name: Apply (CREATE only)
        if: steps.ready.outputs.ok == 'true'
        env:
          ZONE: ${{ vars.PT_ZONE_ID_NEWS }}
        run: |
          node -e 'const p=require("./plan.json");if(p.batch.Changes.some(c=>c.Action!=="CREATE"))process.exit(1);if(!p.batch.Changes.length){console.log("nothing to create");process.exit(0)};require("fs").writeFileSync("batch.json",JSON.stringify(p.batch))'
          if [ -f batch.json ]; then aws route53 change-resource-record-sets --hosted-zone-id "$ZONE" --change-batch file://batch.json --query 'ChangeInfo.Status' --output text | tee -a "$GITHUB_STEP_SUMMARY"; fi
