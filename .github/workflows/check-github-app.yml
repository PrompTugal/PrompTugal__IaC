name: Check GitHub App
# By hand. Mints the App's token and lists what it can see; changes nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - id: app
        uses: actions/create-github-app-token@v1.12.0
        with:
          app-id: ${{ vars.PT_IAC_APP_ID }}
          private-key: ${{ secrets.PT_IAC_APP_PRIVATE_KEY }}
          owner: PrompTugal
          # Only what policy/abp.json lists (privileges), whatever else the App holds.
          permission-metadata: read
          permission-administration: write
          permission-contents: write
          permission-pages: write
      - name: Read with the token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/installation/repositories?per_page=100" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("repositories visible:",j.total_count);for(const r of j.repositories||[])console.log("-",r.full_name)})'
